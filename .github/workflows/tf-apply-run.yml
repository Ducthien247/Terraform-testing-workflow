name: "Terraform Apply — Apply on Approval"

# Trigger: a comment on an approval issue opened by tf-plan.yml.
# Applies only when an authorized reviewer comments "/approve" on an issue
# labelled "tf-apply-approval". A "/deny" comment closes the issue instead.
# Uses only first-party actions.
#
# Resource-group lock handling: the lock is deliberately NOT managed by
# Terraform (a lock in state that CI deletes out from under it just creates
# drift). The apply inspects the live lock and the saved plan, and only lifts
# the lock when the plan actually needs it:
#
#   CanNotDelete + no destroys -> lock stays on
#   CanNotDelete + destroys    -> lift, apply, restore
#   ReadOnly     + no changes  -> lock stays on
#   ReadOnly     + any change  -> lift, apply, restore

on:
  issue_comment:
    types: [created]

# Serialised so two applies can never race on removing/restoring the lock.
concurrency:
  group: terraform-apply-gec
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read   # to download the saved plan artifact from the plan run

env:
  TF_VERSION: "1.5.7"

jobs:
  apply:
    name: Apply on /approve — LPI-EM-GEC
    # Only: real issues (not PRs), our approval label, a "/approve" comment,
    # from a user with write access (owner/member/collaborator).
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        contains(github.event.issue.labels.*.name, 'tf-apply-approval') &&
        startsWith(github.event.comment.body, '/approve') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      }}
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      LOCK_BACKUP: ${{ github.workspace }}/rg-locks.json

    steps:
      - name: Acknowledge approval
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Approval received from @${context.actor}. Applying… [View logs](${runUrl})`,
            });

      - name: Resolve plan run id from issue
        id: planrun
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          RUN_ID=$(printf '%s' "$ISSUE_BODY" | grep -oP '(?<=plan-run-id: )[0-9]+' | head -1)
          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Could not find a 'plan-run-id' marker in the issue body; cannot locate the saved plan." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Download approved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          run-id: ${{ steps.planrun.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=hub-gec.tfstate"

      - name: Azure login
        run: |
          az login --service-principal \
            -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET" \
            --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      # Re-evaluated here rather than trusting the plan run: the lock may have
      # been added, changed or removed while the issue waited for approval.
      - name: Check RG lock against approved plan
        id: lock
        run: .github/scripts/rg-lock.sh status tfplan.json

      - name: Lift RG lock for this apply
        if: steps.lock.outputs.needs_unlock == 'true'
        run: .github/scripts/rg-lock.sh unlock "${{ steps.lock.outputs.rg }}"

      # Applies the exact plan that was reviewed. If state drifted since the
      # plan was created, Terraform refuses the stale plan (safe by design).
      - name: Terraform Apply
        run: terraform apply -input=false tfplan

      # `always()` so the lock comes back even when the apply fails. If the
      # runner itself dies, tf-lock-reconcile.yml puts it back on its next run.
      - name: Restore RG lock
        if: always() && steps.lock.outputs.needs_unlock == 'true'
        run: .github/scripts/rg-lock.sh restore "${{ steps.lock.outputs.rg }}"

      - name: Report success & close issue
        if: success()
        uses: actions/github-script@v7
        env:
          LOCK_LEVEL:   ${{ steps.lock.outputs.level }}
          NEEDS_UNLOCK: ${{ steps.lock.outputs.needs_unlock }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { LOCK_LEVEL, NEEDS_UNLOCK } = process.env;
            const lockNote =
              LOCK_LEVEL === 'None'
                ? ''
                : NEEDS_UNLOCK === 'true'
                  ? `\n🔒 The \`${LOCK_LEVEL}\` lock was lifted for the apply and has been restored.`
                  : `\n🔒 The \`${LOCK_LEVEL}\` lock stayed on throughout.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Terraform apply succeeded. [View logs](${runUrl})${lockNote}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ Terraform apply failed. [View logs](${runUrl}) — the issue stays open so you can retry.`,
            });

  deny:
    name: Close on /deny — LPI-EM-GEC
    if: >-
      ${{
        github.event.issue.pull_request == null &&
        contains(github.event.issue.labels.*.name, 'tf-apply-approval') &&
        startsWith(github.event.comment.body, '/deny') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Close issue as denied
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚫 Denied by @${context.actor}. Closing without applying.`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });
