name: "Terraform Plan"

# Behaviour:
#   - push to ANY branch        -> plan; save plan output as artifact `plan-<sha>`;
#                                  publish to run Summary; if the branch has an
#                                  open PR, update its sticky comment.
#   - pull_request opened/reopened -> if a saved plan exists for the PR's head
#                                  commit (same code), REUSE it as the PR comment
#                                  (no re-plan). Otherwise plan fresh (fallback).
#   - push to main / manual     -> plan; save `tfplan` + `tfplan.json`; report
#                                  whether the apply will need the RG lock
#                                  removed; open an approval issue.
# Only Terraform-relevant changes trigger a run (`paths`), and providers are
# cached. `synchronize` is intentionally NOT a PR trigger: pushes to a PR branch
# are handled by the push run, which avoids two runs racing for the same plan.

on:
  workflow_dispatch:
  push:
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"
      - ".github/workflows/tf-plan.yml"
      - ".github/scripts/rg-lock.sh"
  pull_request:
    branches: [main]
    types: [opened, reopened]
    paths:
      - "**.tf"
      - ".terraform.lock.hcl"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

env:
  TF_VERSION:          "1.9.8"
  TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform.d/plugin-cache

jobs:
  # -- Decide: reuse a previously-saved plan, or run a fresh one --------------
  check:
    name: Decide plan vs reuse
    runs-on: ubuntu-latest
    outputs:
      mode:         ${{ steps.decide.outputs.mode }}          # 'plan' | 'reuse'
      head_sha:     ${{ steps.decide.outputs.head_sha }}
      pr_number:    ${{ steps.decide.outputs.pr_number }}     # '' if none
      reuse_run_id: ${{ steps.decide.outputs.reuse_run_id }}  # run holding the saved plan
    steps:
      - id: decide
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            let headSha, prNumber = '', mode = 'plan', reuseRunId = '';

            if (context.eventName === 'pull_request') {
              headSha  = context.payload.pull_request.head.sha;
              prNumber = context.payload.pull_request.number;
              // Same code already planned on the branch push? Reuse it.
              const res = await github.rest.actions.listArtifactsForRepo({
                owner, repo, name: `plan-${headSha}`, per_page: 100,
              });
              const usable = res.data.artifacts
                .filter(a => !a.expired)
                .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              if (usable.length > 0) {
                mode = 'reuse';
                reuseRunId = usable[0].workflow_run.id;
                core.notice(`Reusing saved plan for ${headSha} (run ${reuseRunId}).`);
              } else {
                core.notice(`No saved plan for ${headSha}; planning fresh (fallback).`);
              }
            } else if (context.eventName === 'push') {
              headSha = context.sha;
              if (context.ref !== 'refs/heads/main') {
                const branch = context.ref.replace('refs/heads/', '');
                const prs = await github.rest.pulls.list({
                  owner, repo, state: 'open', head: `${owner}:${branch}`,
                });
                if (prs.data.length > 0) prNumber = prs.data[0].number;
              }
            } else {
              headSha = context.sha; // workflow_dispatch
            }

            core.setOutput('mode', mode);
            core.setOutput('head_sha', headSha);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('reuse_run_id', String(reuseRunId));

  # -- Reuse path: post the saved plan as the PR comment (no Terraform) -------
  reuse:
    name: Reuse saved plan
    needs: check
    if: needs.check.outputs.mode == 'reuse'
    runs-on: ubuntu-latest
    steps:
      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: plan-${{ needs.check.outputs.head_sha }}
          run-id: ${{ needs.check.outputs.reuse_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: saved-plan

      - name: Comment reused plan on PR
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.check.outputs.pr_number }}
          HEAD_SHA:  ${{ needs.check.outputs.head_sha }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('saved-plan/plan-to-display.txt', 'utf8');
            const MAX = 65536 - 2048;
            if (plan.length > MAX) plan = plan.slice(0, MAX) + '\n\n... (truncated). See the run logs for the full plan.';
            const marker = '<!-- tf-plan:hub-gec -->';
            const sha = process.env.HEAD_SHA.slice(0, 7);
            const body = [
              marker,
              '#### Terraform Plan — Hub (GEC) `reused`',
              `_Reused the plan already generated for commit \`${sha}\` — code unchanged, so no re-plan._`,
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

  # -- Plan path: run Terraform, save the plan, comment / open issue ----------
  plan:
    name: Terraform Plan — LPI-EM-GEC
    needs: check
    if: needs.check.outputs.mode == 'plan'
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID:       ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET:   ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_TENANT_ID:       ${{ secrets.ARM_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      # TEMPORARY: the vault the teardown has to reach; remove with the steps below.
      LEGACY_KV_NAME: vm-terraform-linux-kv
      LEGACY_KV_RG:   rg-terraform-vm

    steps:
      - uses: actions/checkout@v4

      # Unconditional because the temporary Key Vault step below needs it on
      # every branch push. Once that step is gone only the lock check needs
      # Azure, so this can go back to being main/workflow_dispatch only.
      - name: Azure login
        run: |
          az login --service-principal             -u "$ARM_CLIENT_ID" -p "$ARM_CLIENT_SECRET"             --tenant "$ARM_TENANT_ID" --output none
          az account set --subscription "$ARM_SUBSCRIPTION_ID"

      # >>> TEMPORARY — legacy Key Vault teardown ------------------------------
      # State still holds azurerm_key_vault_secret.admin_password. Refreshing
      # (plan) and deleting (apply) it go through the vault's DATA plane, which
      # its firewall blocks from a runner's IP — and the runner IP changes every
      # run. Open a hole for this run so the teardown can complete.
      # DELETE THIS STEP, its twin at the end of the job, and the LEGACY_KV_*
      # env vars once the vault is gone from state.
      - name: Whitelist runner IP in the legacy Key Vault
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          if az keyvault network-rule add \
               --name "$LEGACY_KV_NAME" --resource-group "$LEGACY_KV_RG" \
               --ip-address "$RUNNER_IP" --output none 2>/dev/null; then
            sleep 30   # the ACL change is not effective immediately
          else
            echo "::notice::Legacy Key Vault '$LEGACY_KV_NAME' not reachable or already gone — nothing to whitelist."
          fi
      # <<< END TEMPORARY -------------------------------------------------------

      - name: Prime plugin cache dir
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: terraform-plugins-${{ runner.os }}-${{ hashFiles('.terraform.lock.hcl') }}
          restore-keys: |
            terraform-plugins-${{ runner.os }}-

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${{ vars.TFSTATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ vars.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ vars.TFSTATE_CONTAINER }}" \
            -backend-config="key=hub-gec.tfstate"

      # A management lock never blocks `plan`: reading ARM is allowed under both
      # CanNotDelete and ReadOnly, so nothing needs unlocking here.
      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan | tee plan-to-display.txt
          terraform show -json    tfplan > tfplan.json

      - name: Publish plan to run summary
        run: |
          {
            echo '### Terraform Plan — Hub (GEC)'
            echo ''
            echo '```terraform'
            head -c 900000 plan-to-display.txt
            echo ''
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Save the plan output keyed by commit SHA so a later PR for the same code
      # can reuse it instead of re-planning.
      - name: Save plan output for reuse
        uses: actions/upload-artifact@v4
        with:
          name: plan-${{ needs.check.outputs.head_sha }}
          path: plan-to-display.txt
          retention-days: 5

      # Comment on the PR when this run is tied to one (PR fallback, or a push to
      # a branch that already has an open PR).
      - name: Comment plan on PR
        if: needs.check.outputs.pr_number != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ needs.check.outputs.pr_number }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan-to-display.txt', 'utf8');
            const MAX = 65536 - 2048;
            if (plan.length > MAX) plan = plan.slice(0, MAX) + '\n\n... (truncated). See the run logs for the full plan.';
            const marker = '<!-- tf-plan:hub-gec -->';
            const body = [
              marker,
              `#### Terraform Plan — Hub (GEC) \`${process.env.PLAN_OUTCOME}\``,
              '<details><summary>Show Plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
              '',
              `*Pusher: @${context.actor}, Workflow: \`${context.workflow}\`*`,
            ].join('\n');
            const issue_number = Number(process.env.PR_NUMBER);
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number,
            });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number, body });
            }

      # -- Main / manual: save the plan and open an approval issue ------------

      # Advisory only: tells the reviewer up front whether approving will lift
      # the lock. The apply re-evaluates this itself, because the lock can change
      # between the plan and the approval.
      - name: Check RG lock against plan
        id: lock
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: .github/scripts/rg-lock.sh status tfplan.json

      - name: Upload tfplan for apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: |
            tfplan
            tfplan.json
          retention-days: 5

      - name: Open approval issue with plan
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        env:
          LOCK_LEVEL:   ${{ steps.lock.outputs.level }}
          NEEDS_UNLOCK: ${{ steps.lock.outputs.needs_unlock }}
          DESTROYS:     ${{ steps.lock.outputs.destroys }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan-to-display.txt', 'utf8');
            const MAX = 60000;
            if (plan.length > MAX) plan = plan.slice(0, MAX) + '\n\n... (plan truncated). See the workflow run logs for the full plan.';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { LOCK_LEVEL, NEEDS_UNLOCK, DESTROYS } = process.env;
            const lockLine =
              LOCK_LEVEL === 'None'
                ? '🔓 **RG lock:** none.'
                : NEEDS_UNLOCK === 'true'
                  ? `⚠️ **RG lock:** \`${LOCK_LEVEL}\` — this plan has **${DESTROYS} destroy(s)**, so the apply will temporarily remove the lock and restore it afterwards.`
                  : `🔒 **RG lock:** \`${LOCK_LEVEL}\` — the plan has no destroys, so the lock stays on for the whole apply.`;

            const body = [
              `<!-- plan-run-id: ${context.runId} -->`,
              '### Terraform Plan — Hub (GEC)',
              '',
              `Triggered by @${context.actor} on \`${context.ref}\`. [View run logs](${runUrl})`,
              '',
              lockLine,
              '',
              'An authorized reviewer must comment **`/approve`** on this issue to deploy.',
              'Comment **`/deny`** to reject and close without applying.',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '',
              '</details>',
            ].join('\n');
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Approve Terraform Apply — Hub (GEC) (run ${context.runId})`,
              body,
              labels: ['tf-apply-approval'],
            });
            core.notice(`Approval issue opened: ${issue.data.html_url}`);

      # >>> TEMPORARY — legacy Key Vault teardown ------------------------------
      # Twin of the whitelist step above; delete both together.
      - name: Remove runner IP from the legacy Key Vault
        if: always()
        run: |
          [[ -z "${RUNNER_IP:-}" ]] && exit 0
          az keyvault network-rule remove \
            --name "$LEGACY_KV_NAME" --resource-group "$LEGACY_KV_RG" \
            --ip-address "$RUNNER_IP" --output none 2>/dev/null \
          || echo "::notice::Could not delist runner IP — the vault is likely already destroyed."
      # <<< END TEMPORARY -------------------------------------------------------
